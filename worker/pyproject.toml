[project]
name = "codemap-worker"
version = "0.1.0"
description = "Analysis worker: structure / semantic / history maps and divergence detection"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-python>=0.23",
    "pydriller>=2.6",
    "numpy>=1.26",
    "umap-learn>=0.5",
    "pika>=1.3",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# 로컬 코드 임베딩 모델 (torch 포함, 용량이 커서 Phase 3에서 설치)
embed = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
