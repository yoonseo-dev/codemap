spring.application.name=api
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5442/codemap
spring.datasource.username=codemap
spring.datasource.password=codemap
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.host=localhost
spring.data.redis.port=6389

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5682
spring.rabbitmq.username=codemap
spring.rabbitmq.password=codemap

codemap.analysis-queue=analysis.jobs

# SSE 연결마다 스레드를 하나씩 쓰므로 가상 스레드로 비용을 줄인다
spring.threads.virtual.enabled=true

# 지도 응답(GET /graph)은 노드 수천 개면 수 MB다(gson 3.5MB). gzip으로 약 17배 줄어든다.
# 기본 압축 대상은 json·text 계열이라 SSE(text/event-stream)는 압축되지 않는다.
server.compression.enabled=true
